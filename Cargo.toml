[workspace]
resolver = "2"
members = ["crates/hebnix-sdk", "crates/hebnix-app"]

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["Hebbins", "nixvio64", "xplodingeggo (linux port)"]

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
debug = 1
strip = "none"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1"
ureq = { version = "2", features = ["json"] }
crossbeam-channel = "0.5"
