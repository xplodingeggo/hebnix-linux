name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go (multiplayer sidecar)
        uses: actions/setup-go@v5
        with:
          go-version-file: sidecar/hebnix-tc/go.mod

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: make release

      # bin/ + lib/hebnix/ like the release tarballs: Hebnix looks for the
      # multiplayer helper in ../lib/hebnix next to its own binary.
      # Artifact zips drop the executable bit, so chmod +x both after unzipping.
      - name: Stage binary and multiplayer helper
        run: |
          install -Dm755 target/release/hebnix-app artifact/bin/hebnix-app
          install -Dm755 sidecar/hebnix-tc/hebnix-tc artifact/lib/hebnix/hebnix-tc

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: hebnix-app-linux
          path: artifact/
          if-no-files-found: error
