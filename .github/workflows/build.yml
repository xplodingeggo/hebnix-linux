name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev \
            libayatana-appindicator3-dev libwayland-dev libxkbcommon-dev libudev-dev \
            libasound2-dev libssl-dev libxdo-dev libx11-dev libxtst-dev libxi-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-layer-shell-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: make release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: hebnix-app-linux
          path: target/release/hebnix-app
