name: Install Hebnix Linux build dependencies
description: >
  Installs the apt packages needed to build hebnix-app. Single source of
  truth shared by CI, stable release, and nightly release workflows so the
  package list can't silently drift out of sync between them (see
  install.sh for the same list, kept in sync manually since Arch/Fedora
  package names differ from apt's).
runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libgtk-3-dev \
          libayatana-appindicator3-dev libwayland-dev libxkbcommon-dev libudev-dev \
          libasound2-dev libssl-dev libxdo-dev libx11-dev libxtst-dev libxi-dev \
          libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-layer-shell-dev
